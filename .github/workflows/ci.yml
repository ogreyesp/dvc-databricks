name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=dvc_databricks --cov-report=term-missing -v

      - name: Lint
        run: uv run pylint src/dvc_databricks/

  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: uv build

      - name: Verify package installs and registers dbvol://
        run: |
          uv pip install dist/*.whl --system
          python -c "
          from dvc_objects.fs import known_implementations
          assert 'dbvol' in known_implementations, 'dbvol not registered!'
          print('dbvol registered:', known_implementations['dbvol'])
          "
