name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Semantic Release & PyPI Publish
    runs-on: ubuntu-latest
    concurrency: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Run semantic release (version bump + GitHub release)
        id: semrel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uvx --from python-semantic-release semantic-release version --print > /tmp/new_version || true
          NEW_VERSION=$(cat /tmp/new_version)
          echo "released=$( [ -n "$NEW_VERSION" ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Build package
        if: steps.semrel.outputs.released == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.semrel.outputs.released == 'true'
        run: uvx twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
