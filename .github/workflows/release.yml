name: Release

on:
  push:
    branches:
      - main

# Needed for python-semantic-release to push tags and commits back to the repo
permissions:
  contents: write
  id-token: write  # needed for PyPI trusted publishing (optional but recommended)

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    concurrency: release  # prevent parallel release runs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for semantic-release to compute version
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: pip install python-semantic-release

      - name: Run semantic release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          semantic-release version
          semantic-release publish
