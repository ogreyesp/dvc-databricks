[project]
name = "dvc-databricks"
version = "1.3.0"
description = "DVC remote plugin for Databricks Unity Catalog Volumes"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Óscar Reyes" }]
keywords = ["dvc", "databricks", "data-versioning", "mlops", "unity-catalog"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.40.0",
    "dvc>=3.0",
    "dvc-objects>=5.0",
    "fsspec",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pylint",
    "sphinx>=7.0",
    "sphinx-autodoc-typehints",
    "furo",
    "pip>=26.0.1",
]

[project.urls]
Homepage = "https://ogreyesp.github.io/dvc-databricks"
Repository = "https://github.com/ogreyesp/dvc-databricks"
Issues = "https://github.com/ogreyesp/dvc-databricks/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dvc_databricks"]

# force-include places dvc_databricks_startup.pth at the root of the wheel.
# pip installs wheel-root files directly into site-packages, so Python will
# execute "import dvc_databricks" at interpreter startup in every process —
# including DVC CLI subprocesses — registering the dbvol:// protocol.
[tool.hatch.build.targets.wheel.force-include]
"src/dvc_databricks_startup.pth" = "dvc_databricks_startup.pth"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["dvc_databricks"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring", # already enforced via module docstrings in code
    "too-few-public-methods",   # data classes and small helpers are fine
    "abstract-method",          # fsspec/dvc_objects have many optional abstract methods
    "broad-exception-caught",   # Databricks SDK raises generic exceptions; we catch-and-rethrow
    "raise-missing-from",       # intentional — we translate SDK errors to stdlib FileNotFoundError
    "arguments-differ",         # fsspec overrides intentionally drop optional **kwargs
    "unused-argument",          # **kwargs kept for fsspec signature compatibility
    "import-outside-toplevel",  # dvc.repo is imported inside cmd_add to defer heavy import
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = "uv build"
dist_path = "dist/"
upload_to_pypi = false
upload_to_release = false
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat",
    "fix",
    "perf",
    "refactor",
    "docs",
    "chore",
    "style",
    "test",
    "build",
    "ci",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
